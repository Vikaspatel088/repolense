<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>RepoLens V2 — Codebase Architecture &amp; Dependency Intelligence</title>
<style>
@layer reset, tokens, base, layout, components, views;

@layer reset {
  *, *::before, *::after { box-sizing: border-box; }
  body, h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
  ul, ol { padding: 0; list-style: none; }
  button, input, select { font: inherit; color: inherit; }
}

@layer tokens {
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-subtle: #f1f5f9;
    --surface-hover: #e2e8f0;
    --ink: #0f172a;
    --ink-muted: #475569;
    --ink-subtle: #94a3b8;
    --line: #e2e8f0;
    --line-subtle: #cbd5e1;
    --line-focus: #3b82f6;

    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-subtle: #eff6ff;
    --accent-ink: #ffffff;

    --ok: #059669;
    --ok-subtle: #ecfdf5;
    --warn: #d97706;
    --warn-subtle: #fffbeb;
    --bad: #dc2626;
    --bad-subtle: #fef2f2;

    --py: #2563eb;
    --js: #d97706;
    --ts: #7c3aed;

    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;
    --r-full: 9999px;

    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.05);
    --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);

    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #090d16;
      --surface: #111726;
      --surface-subtle: #192237;
      --surface-hover: #222f4c;
      --ink: #f1f5f9;
      --ink-muted: #94a3b8;
      --ink-subtle: #64748b;
      --line: #1e293b;
      --line-subtle: #334155;
      --line-focus: #60a5fa;

      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-subtle: #1e293b;
      --accent-ink: #ffffff;

      --ok: #10b981;
      --ok-subtle: #064e3b33;
      --warn: #f59e0b;
      --warn-subtle: #78350f33;
      --bad: #ef4444;
      --bad-subtle: #7f1d1d33;

      --py: #60a5fa;
      --js: #fcd34d;
      --ts: #a78bfa;

      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
    }
  }
}

@layer base {
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 var(--sans);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mono { font-family: var(--mono); font-size: 0.88em; }
  .mute { color: var(--ink-muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
}

@layer layout {
  header.app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 40;
    box-shadow: var(--shadow-sm);
  }
  .header-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.65rem 1.25rem;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    min-width: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: -0.02em;
    color: var(--ink);
    text-decoration: none;
    user-select: none;
  }
  .brand-logo {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: linear-gradient(135deg, var(--accent) 0%, #7c3aed 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    box-shadow: 0 2px 6px -1px rgba(37,99,235,0.4);
  }
  .brand-logo svg { width: 16px; height: 16px; stroke-width: 2.2; }
  .version-tag {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.1rem 0.4rem;
    border-radius: var(--r-full);
    background: var(--surface-subtle);
    color: var(--accent);
    border: 1px solid var(--line);
  }
  .brand-sub {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--ink-subtle);
    border-left: 1px solid var(--line);
    padding-left: 0.75rem;
    white-space: nowrap;
  }
  @media (max-width: 860px) { .brand-sub { display: none; } }

  .header-center {
    flex: 1 1 auto;
    display: flex;
    justify-content: center;
    min-width: 0;
  }
  .repo-indicator {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.3rem 0.65rem;
    background: var(--surface-subtle);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    font-size: 0.85rem;
    max-width: 100%;
  }
  .repo-indicator .repo-name {
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: nowrap;
  }

  nav.app-nav {
    display: flex;
    gap: 0.25rem;
    padding: 0 1.25rem 0.5rem 1.25rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav.app-nav::-webkit-scrollbar { display: none; }
  nav.app-nav button {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.4rem 0.8rem;
    border: 1px solid transparent;
    border-radius: var(--r-md);
    background: transparent;
    color: var(--ink-muted);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  nav.app-nav button:hover:not(:disabled) {
    background: var(--surface-subtle);
    color: var(--ink);
  }
  nav.app-nav button[aria-current="page"] {
    background: var(--accent-subtle);
    border-color: color-mix(in oklab, var(--accent) 30%, transparent);
    color: var(--accent);
    font-weight: 600;
  }
  nav.app-nav button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .app-body {
    flex: 1;
    display: flex;
    position: relative;
    max-width: 1600px;
    width: 100%;
    margin: 0 auto;
    padding: 1.25rem;
    gap: 1.25rem;
    align-items: flex-start;
  }
  main#main {
    flex: 1;
    min-width: 0;
  }
  aside#drawer {
    width: 400px;
    max-width: 100%;
    position: sticky;
    top: 6.5rem;
    max-height: calc(100dvh - 8rem);
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-md);
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    z-index: 30;
  }
  @media (max-width: 1024px) {
    .app-body { flex-direction: column; padding: 0.75rem; }
    aside#drawer { width: 100%; position: static; max-height: none; }
  }
}

@layer components {
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 1.25rem;
    box-shadow: var(--shadow-sm);
  }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
    gap: 0.75rem;
  }
  .panel-title {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .panel-subtitle {
    font-size: 0.8rem;
    color: var(--ink-muted);
  }

  button, a.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.45rem;
    font-weight: 500;
    font-size: 0.85rem;
    border-radius: var(--r-md);
    padding: 0.45rem 0.85rem;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    text-decoration: none;
    cursor: pointer;
    line-height: 1.3;
    transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.08s;
  }
  button:hover:not(:disabled), a.btn:hover:not([aria-disabled="true"]) {
    background: var(--surface-hover);
    border-color: var(--line-subtle);
  }
  button:active:not(:disabled), a.btn:active:not([aria-disabled="true"]) {
    transform: translateY(1px);
  }
  button.primary, a.btn.primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: transparent;
  }
  button.primary:hover:not(:disabled), a.btn.primary:hover:not([aria-disabled="true"]) {
    background: var(--accent-hover);
  }
  button.subtle {
    border-color: transparent;
    background: transparent;
    color: var(--ink-muted);
  }
  button.subtle:hover:not(:disabled) {
    background: var(--surface-subtle);
    color: var(--ink);
  }
  button.sm, a.btn.sm {
    padding: 0.25rem 0.55rem;
    font-size: 0.78rem;
    border-radius: var(--r-sm);
  }
  button:disabled, a.btn[aria-disabled="true"] {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
  }

  input, select {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 0.5rem 0.75rem;
    font-size: 0.88rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 15%, transparent);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    font-size: 0.72rem;
    font-weight: 500;
    padding: 0.15rem 0.5rem;
    border-radius: var(--r-full);
    border: 1px solid var(--line);
    background: var(--surface-subtle);
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .badge.ok, .badge.high { background: var(--ok-subtle); color: var(--ok); border-color: color-mix(in oklab, var(--ok) 30%, transparent); }
  .badge.warn, .badge.medium { background: var(--warn-subtle); color: var(--warn); border-color: color-mix(in oklab, var(--warn) 30%, transparent); }
  .badge.bad, .badge.low { background: var(--bad-subtle); color: var(--bad); border-color: color-mix(in oklab, var(--bad) 30%, transparent); }
  .badge.accent { background: var(--accent-subtle); color: var(--accent); border-color: color-mix(in oklab, var(--accent) 30%, transparent); }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot.python { background: var(--py); }
  .dot.javascript { background: var(--js); }
  .dot.typescript { background: var(--ts); }

  .row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .row.sb { justify-content: space-between; }
  .stack { display: flex; flex-direction: column; gap: 1rem; }

  kbd {
    display: inline-flex;
    align-items: center;
    padding: 0.1rem 0.35rem;
    font: 0.72rem var(--mono);
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--surface-subtle);
    color: var(--ink-muted);
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 1rem 1.15rem;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 0.5rem;
    transition: transform 0.15s, border-color 0.15s;
  }
  .stat-card:hover { border-color: var(--line-subtle); }
  .stat-card-title {
    font-size: 0.78rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .stat-card-value {
    font-size: 1.85rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .stat-card-desc {
    font-size: 0.78rem;
    color: var(--ink-subtle);
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 0.85rem;
  }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.65s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(1turn); } }

  pre.src-view {
    margin-top: 0.75rem;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 0.6rem 0.75rem;
    font: 12px/1.6 var(--mono);
    overflow-x: auto;
    max-height: 280px;
    scrollbar-width: thin;
  }
  pre.src-view span.line-wrap {
    display: flex;
    white-space: pre;
  }
  pre.src-view span.line-num {
    user-select: none;
    color: var(--ink-subtle);
    width: 3.5rem;
    text-align: right;
    padding-right: 0.85rem;
    flex-shrink: 0;
  }
  pre.src-view span.line-text {
    flex: 1;
  }
  pre.src-view span.hl {
    background: color-mix(in oklab, var(--accent) 15%, transparent);
    border-radius: 3px;
  }
  pre.src-view span.hl .line-num {
    color: var(--accent);
    font-weight: bold;
  }

  button.file-link {
    background: transparent;
    border: none;
    padding: 0;
    color: var(--accent);
    font-family: var(--mono);
    font-size: 0.86em;
    cursor: pointer;
    text-align: left;
    overflow-wrap: anywhere;
    transition: color 0.15s;
  }
  button.file-link:hover {
    text-decoration: underline;
    color: var(--accent-hover);
  }

  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }
  table.data-table th, table.data-table td {
    padding: 0.6rem 0.75rem;
    text-align: left;
    border-top: 1px solid var(--line);
  }
  table.data-table th {
    border-top: none;
    background: var(--surface-subtle);
    color: var(--ink-muted);
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    position: sticky;
    top: 0;
    z-index: 5;
    cursor: pointer;
    user-select: none;
  }
  table.data-table th:hover { color: var(--ink); }
  table.data-table tr:hover td { background: var(--surface-subtle); }
  table.data-table td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }

  dialog#cmd-pal {
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow-xl);
    width: min(640px, 92vw);
    padding: 0;
    margin: 12vh auto auto auto;
  }
  dialog#cmd-pal::backdrop {
    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(4px);
  }
  .pal-input-wrap {
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--line);
    padding: 0 1rem;
    gap: 0.75rem;
  }
  .pal-input-wrap svg { width: 18px; height: 18px; color: var(--ink-subtle); }
  .pal-input-wrap input {
    width: 100%;
    border: none;
    box-shadow: none;
    padding: 1rem 0;
    font-size: 1.05rem;
    background: transparent;
  }
  .pal-input-wrap input:focus { box-shadow: none; }
  ul#pal-results {
    max-height: 52vh;
    overflow-y: auto;
    padding: 0.5rem;
  }
  ul#pal-results li button {
    width: 100%;
    border: none;
    background: transparent;
    border-radius: var(--r-md);
    padding: 0.6rem 0.85rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    text-align: left;
    cursor: pointer;
  }
  ul#pal-results li button[aria-selected="true"], ul#pal-results li button:hover {
    background: var(--accent-subtle);
    color: var(--accent);
  }
}

@layer views {
  /* Onboarding / First-Run */
  .onboarding {
    max-width: 920px;
    margin: 1.5rem auto 3rem auto;
    display: flex;
    flex-direction: column;
    gap: 1.75rem;
  }
  .hero-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 2.25rem 2.5rem;
    box-shadow: var(--shadow-md);
    position: relative;
    overflow: hidden;
  }
  .hero-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--accent) 0%, #7c3aed 50%, var(--ok) 100%);
  }
  .hero-title {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--ink);
    line-height: 1.25;
    margin-bottom: 0.75rem;
  }
  .hero-lead {
    font-size: 1.05rem;
    color: var(--ink-muted);
    line-height: 1.6;
    max-width: 780px;
  }

  .source-tabs {
    display: flex;
    gap: 0.5rem;
    border-bottom: 1px solid var(--line);
    padding-bottom: 0.75rem;
    margin: 1.5rem 0 1.25rem 0;
  }
  .source-tab-btn {
    padding: 0.45rem 1rem;
    border-radius: var(--r-md);
    border: 1px solid var(--line);
    background: var(--surface-subtle);
    color: var(--ink-muted);
    font-weight: 500;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .source-tab-btn.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }

  .source-box {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }
  .source-input-row {
    display: flex;
    gap: 0.65rem;
  }
  .source-input-row input {
    flex: 1;
    font-family: var(--mono);
    font-size: 0.95rem;
    padding: 0.65rem 1rem;
  }
  .source-hint {
    font-size: 0.82rem;
    color: var(--ink-muted);
    line-height: 1.5;
  }

  .sample-cta-banner {
    background: var(--surface-subtle);
    border: 1px dashed var(--line-subtle);
    border-radius: var(--r-lg);
    padding: 1.25rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.25rem;
    flex-wrap: wrap;
  }

  .feature-preview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1rem;
  }
  .feature-preview-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 1.2rem;
    box-shadow: var(--shadow-sm);
  }
  .feature-icon-wrap {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--accent-subtle);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.75rem;
  }
  .feature-icon-wrap svg { width: 20px; height: 20px; }
  .feature-preview-card h4 {
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 0.35rem;
  }
  .feature-preview-card p {
    font-size: 0.82rem;
    color: var(--ink-muted);
    line-height: 1.5;
  }

  /* Graph */
  .graph-container {
    position: relative;
    height: min(72dvh, 700px);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .graph-container svg {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
  }
  .graph-container svg:active { cursor: grabbing; }

  .graph-toolbar {
    position: absolute;
    top: 0.85rem;
    right: 0.85rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: color-mix(in oklab, var(--surface) 92%, transparent);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: var(--r-md);

  // Architecture Pillars: Entry Points, High Fan-In, High Fan-Out
  const columns = h('div', { style: 'display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:1rem;' },
    // Entry Points
    h('div', { class: 'panel' },
      h('div', { class: 'panel-header' },
        h('h3', { class: 'panel-title', style: 'font-size:0.95rem;' }, 'Detected Entry Points'),
        badge(`${entryPoints.length} files`)
      ),
      entryPoints.length ? h('ul', { style: 'display:flex; flex-direction:column; gap:0.5rem;' },
        entryPoints.map(f => h('li', {
          style: 'padding:0.45rem 0; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; gap:0.5rem;'
        },
          fileLink(f.path),
          badge(f.entry.confidence, f.entry.confidence)
        ))
      ) : h('p', { class: 'mute', style: 'font-size:0.85rem;' }, 'No standard entry points identified.'),
      h('p', { class: 'mute', style: 'font-size:0.78rem; margin-top:0.75rem;' },
        'Confidence reflects evidence: __main__ guards &amp; package.json declarations vs file naming conventions.'

    ),

    // Top Fan-In (Most Depended-Upon Hubs)
    h('div', { class: 'panel' },
      h('div', { class: 'panel-header' },
        h('h3', { class: 'panel-title', style: 'font-size:0.95rem;' }, 'Core Hubs (Highest Fan-In)'),
        badge('In-degree')
      ),
      st.top_fan_in.length ? h('ul', { style: 'display:flex; flex-direction:column; gap:0.5rem;' },
        st.top_fan_in.slice(0, 7).map(item => h('li', {
          style: 'padding:0.45rem 0; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; gap:0.5rem;'
        },
          fileLink(item.file),
          badge(`Imported by ${item.count}`, 'accent')
        ))
      ) : h('p', { class: 'mute', style: 'font-size:0.85rem;' }, 'No local dependencies found.'),
      h('p', { class: 'mute', style: 'font-size:0.78rem; margin-top:0.75rem;' },
        'Files that many other modules rely on. Changes to these hubs carry highest blast radius.'
      )
    ),

    // Top Fan-Out (Heavy Consumers)
    h('div', { class: 'panel' },
      h('div', { class: 'panel-header' },
        h('h3', { class: 'panel-title', style: 'font-size:0.95rem;' }, 'Heavy Consumers (Highest Fan-Out)'),
        badge('Out-degree')
      ),
      st.top_fan_out.length ? h('ul', { style: 'display:flex; flex-direction:column; gap:0.5rem;' },
        st.top_fan_out.slice(0, 7).map(item => h('li', {
          style: 'padding:0.45rem 0; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; gap:0.5rem;'
        },
          fileLink(item.file),
          badge(`Imports ${item.count}`)
        ))
      ) : h('p', { class: 'mute', style: 'font-size:0.85rem;' }, 'No outgoing imports found.'),
      h('p', { class: 'mute', style: 'font-size:0.78rem; margin-top:0.75rem;' },
        'Orchestration modules that aggregate multiple sub-services.'
      )
    )
  );

  // Warnings if any
  const warnPanel = S.snap.warnings?.length ? h('div', { class: 'panel' },
    h('h3', { class: 'panel-title', style: 'font-size:0.95rem; margin-bottom:0.6rem; color:var(--warn);' }, '⚠️ Scanner Warnings'),
    S.snap.warnings.map(w => h('div', { class: 'alert-banner warn', style: 'margin-bottom:0.5rem;' }, w))
  ) : null;

  add(container, headRow, grid, langCard, columns, warnPanel);
  add(m, container);
}

function renderStatCard(title, val, desc, badgeColor = null) {
  const card = h('div', { class: 'stat-card' },
    h('div', { class: 'stat-card-title' },
      title,
      badgeColor ? badge(badgeColor === 'ok' ? 'Healthy' : badgeColor.toUpperCase(), badgeColor) : null
    ),
    h('div', {
      class: 'stat-card-value',
      style: badgeColor ? `color: var(--${badgeColor})` : ''
    }, val),
    h('div', { class: 'stat-card-desc' }, desc)
  );
  return card;
}

// -----------------------------------------
// View: Dependency Graph
// -----------------------------------------
function layoutGraph(nodes, links) {
  const W = 1000, H = 700;
  const ix = new Map(nodes.map(n => [n.id, n]));
  
  nodes.forEach((n, i) => {
    const a = i * 2.399963;
    const r = 18 * Math.sqrt(i + 1);
    n.x = W / 2 + r * Math.cos(a);
    n.y = H / 2 + r * Math.sin(a);
    n.vx = n.vy = 0;
  });

  const L = links.map(e => [ix.get(e.source), ix.get(e.target)]).filter(([a, b]) => a && b);
  const N = 240;

  for (let it = 0; it < N; it++) {
    const cool = 1 - it / N;
    // Node-node repulsion
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        const d2 = dx * dx + dy * dy + 0.01;
        if (d2 > 120000) continue;
        const d = Math.sqrt(d2);
        const f = 2800 / d2;
        dx /= d; dy /= d;
        a.vx += dx * f; a.vy += dy * f;
        b.vx -= dx * f; b.vy -= dy * f;
      }
    }
    // Link attraction
    for (const [a, b] of L) {
      let dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 1;
      const f = (d - 90) * 0.025;
      dx /= d; dy /= d;
      a.vx += dx * f; a.vy += dy * f;
      b.vx -= dx * f; b.vy -= dy * f;
    }
    // Centering & damping
    for (const n of nodes) {
      n.vx += (W / 2 - n.x) * 0.005;
      n.vy += (H / 2 - n.y) * 0.005;
      n.x += Math.max(-14, Math.min(14, n.vx)) * cool;
      n.y += Math.max(-14, Math.min(14, n.vy)) * cool;
      n.vx *= 0.65;
      n.vy *= 0.65;
    }
  }
}

function renderGraph(m) {
  const G = S.graph;
  const all = S.snap.files;
  let list = all.filter(f => (!G.lang || f.lang === G.lang) && (!G.hideIso || f.fan_in + f.fan_out > 0));

  const CAP = 350;
  const capped = list.length > CAP;
  if (capped) {
    list = [...list].sort((a, b) => (b.fan_in + b.fan_out) - (a.fan_in + a.fan_out)).slice(0, CAP);
  }

  const ids = new Set(list.map(f => f.path));
  const links = S.snap.edges.filter(e => ids.has(e.source) && ids.has(e.target));
  const nodes = list.map(f => ({ id: f.path, f }));

  layoutGraph(nodes, links);
  const ix = new Map(nodes.map(n => [n.id, n]));

  const cycSets = S.snap.cycles.map(c => new Set(c.members));
  const inCycle = e => cycSets.some(c => c.has(e.source) && c.has(e.target));

  const gq = G.q.toLowerCase();
  const matchFilter = n => !gq || n.id.toLowerCase().includes(gq);

  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y), pad = 70;
  const bb = nodes.length ? [Math.min(...xs) - pad, Math.min(...ys) - pad, Math.max(...xs) + pad, Math.max(...ys) + pad] : [0, 0, 1000, 700];
  let vb = [bb[0], bb[1], Math.max(bb[2] - bb[0], 250), Math.max(bb[3] - bb[1], 200)];

  const initialVb = [...vb];

  const svg = s('svg', {
    viewBox: vb.join(' '),
    role: 'img',
    'aria-label': 'Interactive dependency graph'
  });

  // Arrow markers
  svg.append(s('defs', {},
    s('marker', { id: 'ar-normal', viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '6', markerHeight: '6', orient: 'auto-start-reverse' },
      s('path', { d: 'M0 1.5L9 5L0 8.5z', fill: 'var(--ink-subtle)' })),
    s('marker', { id: 'ar-hot', viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse' },
      s('path', { d: 'M0 1.5L9 5L0 8.5z', fill: 'var(--accent)' })),
    s('marker', { id: 'ar-cyc', viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse' },
      s('path', { d: 'M0 1.5L9 5L0 8.5z', fill: 'var(--bad)' }))
  ));

  const edgeGroup = s('g'), nodeGroup = s('g');
  svg.append(edgeGroup, nodeGroup);

  const radius = n => 6 + Math.min(14, Math.sqrt(n.f.fan_in) * 3.5);
  const langColors = { python: 'var(--py)', javascript: 'var(--js)', typescript: 'var(--ts)' };

  const edgeEls = links.map(e => {
    const a = ix.get(e.source), b = ix.get(e.target);
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    const r = radius(b) + 3;
    const cyc = inCycle(e);
    const lineEl = s('line', {
      class: `edge ${cyc ? 'cyc' : ''}`,
      x1: a.x, y1: a.y,
      x2: b.x - (dx / d) * r, y2: b.y - (dy / d) * r,
      'marker-end': `url(#${cyc ? 'ar-cyc' : 'ar-normal'})`
    });
    edgeGroup.append(lineEl);
    return [e, lineEl];
  });

  const tooltipEl = h('div', { class: 'graph-tooltip' });

  const nodeEls = nodes.map(n => {
    const isSel = S.sel === n.id;
    const r = radius(n);
    const g = s('g', {
      class: 'node',
      tabindex: 0,
      role: 'button',
      'aria-label': `${n.id}, imported by ${n.f.fan_in}, imports ${n.f.fan_out}`,
      transform: `translate(${n.x} ${n.y})`,
      onclick: () => inspectFile(n.id),
      onkeydown: ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); inspectFile(n.id); } },
      onmouseenter: ev => {
        tooltipEl.style.display = 'block';
        tooltipEl.innerHTML = `<b>${baseName(n.id)}</b><br><span style="opacity:0.8">${n.id}</span><br><span>Lang: ${n.f.lang} · LOC: ${n.f.loc}</span><br><span>In: ${n.f.fan_in} | Out: ${n.f.fan_out}</span>`;
        const rect = wrap.getBoundingClientRect();
        tooltipEl.style.left = `${ev.clientX - rect.left + 12}px`;
        tooltipEl.style.top = `${ev.clientY - rect.top + 12}px`;
      },
      onmousemove: ev => {
        const rect = wrap.getBoundingClientRect();
        tooltipEl.style.left = `${ev.clientX - rect.left + 12}px`;
        tooltipEl.style.top = `${ev.clientY - rect.top + 12}px`;
      },
      onmouseleave: () => { tooltipEl.style.display = 'none'; }
    },
      s('circle', { r, fill: langColors[n.f.lang] || 'var(--ink-muted)' }),
      (nodes.length <= 60 || isSel || n.f.fan_in >= 2) ? s('text', { x: r + 4, y: 3 }, baseName(n.id)) : null
    );
    nodeGroup.append(g);
    return [n, g];
  });

  function paintGraph() {
    const sel = S.sel;
    edgeEls.forEach(([e, lineEl]) => {
      const cyc = inCycle(e);
      const hot = sel && (e.source === sel || e.target === sel);
      lineEl.classList.toggle('hot', !!hot);
      lineEl.classList.toggle('dim', !!sel && !hot);
      lineEl.setAttribute('marker-end', `url(#${hot ? 'ar-hot' : (cyc ? 'ar-cyc' : 'ar-normal')})`);
    });

    nodeEls.forEach(([n, g]) => {
      const rel = sel && (n.id === sel || n.f.depends_on?.includes(sel) || n.f.dependents?.includes(sel));
      g.classList.toggle('sel', n.id === sel);
      g.classList.toggle('dim', !matchFilter(n) || (!!sel && !rel));
    });
  }
  paintGraph();
  window.__paintGraph = paintGraph;

  // Zoom & Pan
  const wrap = h('div', { class: 'graph-container' }, svg, tooltipEl);

  const zoomTo = factor => {
    const cx = vb[0] + vb[2] / 2;
    const cy = vb[1] + vb[3] / 2;
    const nw = vb[2] * factor;
    const nh = vb[3] * factor;
    vb = [cx - nw / 2, cy - nh / 2, nw, nh];
    svg.setAttribute('viewBox', vb.join(' '));
  };

  const fitView = () => {
    vb = [...initialVb];
    svg.setAttribute('viewBox', vb.join(' '));
  };

  const toolbar = h('div', { class: 'graph-toolbar' },
    h('button', { class: 'subtle sm', title: 'Zoom in', onclick: () => zoomTo(0.8) }, '+'),
    h('button', { class: 'subtle sm', title: 'Zoom out', onclick: () => zoomTo(1.25) }, '−'),
    h('button', { class: 'subtle sm', title: 'Fit to screen', onclick: fitView }, 'Fit')
  );
  wrap.append(toolbar);

  const legend = h('div', { class: 'graph-legend' },
    h('div', { class: 'graph-legend-item' }, langDot('python'), 'Python'),
    h('div', { class: 'graph-legend-item' }, langDot('javascript'), 'JavaScript'),
    h('div', { class: 'graph-legend-item' }, langDot('typescript'), 'TypeScript'),
    h('div', { class: 'graph-legend-item' }, h('span', { style: 'color:var(--bad); font-weight:bold;' }, '---'), 'Cycle Loop'),
    h('div', { class: 'graph-legend-item' }, 'Arrow: A → B means A imports B')
  );
  wrap.append(legend);

  // Wheel zoom
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    const px = vb[0] + ((e.clientX - r.left) / r.width) * vb[2];
    const py = vb[1] + ((e.clientY - r.top) / r.height) * vb[3];
    const k = e.deltaY > 0 ? 1.15 : 1 / 1.15;
    vb = [px - (px - vb[0]) * k, py - (py - vb[1]) * k, vb[2] * k, vb[3] * k];
    svg.setAttribute('viewBox', vb.join(' '));
  }, { passive: false });

  // Drag pan
  let drag = null;
  svg.addEventListener('pointerdown', e => {
    if (e.target.closest('.node')) return;
    drag = [e.clientX, e.clientY, [...vb]];
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    const r = svg.getBoundingClientRect();
    vb = [
      drag[2][0] - ((e.clientX - drag[0]) / r.width) * vb[2],
      drag[2][1] - ((e.clientY - drag[1]) / r.height) * vb[3],
      vb[2],
      vb[3]
    ];
    svg.setAttribute('viewBox', vb.join(' '));
  });
  svg.addEventListener('pointerup', () => { drag = null; });

  // Top Filter Controls
  const filterControls = h('div', { class: 'panel', style: 'padding:0.75rem 1rem;' },
    h('div', { class: 'row sb' },
      h('div', { class: 'row' },
        h('input', {
          type: 'search',
          placeholder: 'Search / highlight nodes…',
          value: G.q,
          style: 'min-width:220px;',
          oninput: e => { G.q = e.target.value; paintGraph(); }
        }),
        h('select', {
          onchange: e => { G.lang = e.target.value; render(); }
        },
          h('option', { value: '' }, 'All Languages'),
          Object.keys(S.snap.stats.languages).map(l => h('option', { value: l, selected: G.lang === l }, l))
        ),
        h('label', { class: 'row', style: 'font-size:0.85rem; user-select:none; cursor:pointer;' },
          h('input', {
            type: 'checkbox',
            checked: G.hideIso,
            onchange: e => { G.hideIso = e.target.checked; render(); }
          }),
          'Hide disconnected files'
        )
      ),
      h('div', { class: 'row' },
        badge(`${nodes.length} nodes · ${links.length} dependencies`),
        capped ? badge(`Capped at top ${CAP} connected`, 'warn') : null
      )
    )
  );

  const container = h('div', { class: 'stack' }, filterControls, wrap);
  add(m, container);
}

// -----------------------------------------
// View: Files & Symbols Explorer
// -----------------------------------------
function renderFiles(m) {
  const q = S.fileQ.toLowerCase();
  const [colKey, dir] = S.sort;

  let rows = S.snap.files.filter(f => {
    const matchQ = !q || f.path.toLowerCase().includes(q) || f.defs.some(d => d.name.toLowerCase().includes(q));
    const matchLang = !S.fileLang || f.lang === S.fileLang;
    return matchQ && matchLang;
  });

  rows.sort((a, b) => {
    let diff = 0;
    if (colKey === 'path') diff = a.path.localeCompare(b.path);
    else if (colKey === 'defs') diff = a.defs.length - b.defs.length;
    else diff = (a[colKey] || 0) - (b[colKey] || 0);
    return diff * dir || a.path.localeCompare(b.path);
  });

  const sortHeader = (key, label) => h('th', {
    role: 'columnheader',
    'aria-sort': S.sort[0] === key ? (S.sort[1] < 0 ? 'descending' : 'ascending') : 'none',
    onclick: () => {
      S.sort = [key, S.sort[0] === key ? -S.sort[1] : -1];
      render();
    }
  }, label, S.sort[0] === key ? (S.sort[1] < 0 ? ' ↓' : ' ↑') : '');

  const toolRow = h('div', { class: 'panel', style: 'padding:0.75rem 1rem;' },
    h('div', { class: 'row sb' },
      h('div', { class: 'row' },
        h('input', {
          type: 'search',
          placeholder: 'Filter files or symbols…',
          value: S.fileQ,
          style: 'min-width:260px;',
          oninput: e => {
            S.fileQ = e.target.value;
            const pos = e.target.selectionStart;
            render();
            const input = $('#main input[type="search"]');
            if (input) { input.focus(); input.setSelectionRange(pos, pos); }
          }
        }),
        h('select', {
          onchange: e => { S.fileLang = e.target.value; render(); }
        },
          h('option', { value: '' }, 'All Languages'),
          Object.keys(S.snap.stats.languages).map(l => h('option', { value: l, selected: S.fileLang === l }, l))
        )
      ),
      h('span', { class: 'mute', style: 'font-size:0.85rem;' },
        `Showing ${Math.min(rows.length, 500)} of ${S.snap.files.length} files`
      )
    )
  );

  const tablePanel = h('div', { class: 'panel', style: 'padding:0; overflow:hidden;' },
    h('div', { style: 'max-height: 65vh; overflow-y: auto;' },
      h('table', { class: 'data-table' },
        h('thead', {},
          h('tr', {},
            sortHeader('path', 'Source File'),
            sortHeader('lang', 'Language'),
            sortHeader('loc', 'Lines'),
            sortHeader('fan_in', 'In (Dependents)'),
            sortHeader('fan_out', 'Out (Imports)'),
            sortHeader('defs', 'Symbols'),
            h('th', {}, 'Status')
          )
        ),
        h('tbody', {},
          rows.slice(0, 500).map(f => {
            const hasCyc = S.snap.cycles.some(c => c.members.includes(f.path));
            return h('tr', {},
              h('td', {},
                h('div', { class: 'row', style: 'gap:0.45rem;' },
                  langDot(f.lang),
                  fileLink(f.path)
                )
              ),
              h('td', {}, f.lang),
              h('td', { class: 'num' }, f.loc),
              h('td', { class: 'num' }, f.fan_in),
              h('td', { class: 'num' }, f.fan_out),
              h('td', { class: 'num' }, f.defs.length),
              h('td', {},
                f.error ? badge('Parse Error', 'bad') :
                hasCyc ? badge('In Cycle', 'bad') :
                f.entry ? badge('Entry', f.entry.confidence) :
                badge('Healthy', 'ok')
              )
            );
          })
        )
      )
    )
  );

  const container = h('div', { class: 'stack' }, toolRow, tablePanel);
  add(m, container);
}

// -----------------------------------------
// View: Impact Analysis (BFS Blast Radius)
// -----------------------------------------
function renderImpact(m) {
  const sortedFiles = [...S.snap.files].sort((a, b) => b.fan_in - a.fan_in || a.path.localeCompare(b.path));
  const resultContainer = h('div');

  const executeImpact = async () => {
    const target = S.impactTarget;
    if (!target) return;
    put(resultContainer, h('div', { class: 'row', style: 'padding:1.5rem 0;' }, h('span', { class: 'spinner' }), ' Computing reachability tree…'));

    try {
      const data = await api(`/api/impact?path=${encodeURIComponent(target)}`);
      
      const hopGroups = {};
      data.dependents.forEach(d => {
        (hopGroups[d.distance] ??= []).push(d);
      });

      const maxDist = data.dependents.length ? Math.max(...data.dependents.map(d => d.distance)) : 0;

      put(resultContainer,
        h('div', { class: 'stat-grid', style: 'margin: 1.25rem 0;' },
          renderStatCard('Total Blast Radius', `${data.count} files`, 'Potentially affected downstream', data.count ? 'warn' : 'ok'),
          renderStatCard('Direct Dependents', `${data.direct.length} files`, 'Immediate 1st-hop importers'),
          renderStatCard('Maximum Depth', `${maxDist} hops`, 'Deepest propagation path')
        ),
        h('div', { class: 'alert-banner info' },
          h('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '2' },
            s('circle', { cx: '12', cy: '12', r: '10' }), s('line', { x1: '12', y1: '16', x2: '12', y2: '12' }), s('line', { x1: '12', y1: '8', x2: '12.01', y2: '8' })),
          h('div', {},
            h('b', {}, 'Static BFS Propagation Notice: '),
            data.note
          )
        ),
        data.count ? Object.entries(hopGroups).map(([dist, items]) =>
          h('div', { class: 'panel', style: 'margin-top:1rem;' },
            h('div', { class: 'panel-header' },
              h('h3', { class: 'panel-title', style: 'font-size:0.95rem;' },
                dist === '1' ? 'Direct Dependents (1 Hop Away)' : `Transitive Dependents (${dist} Hops Away)`
              ),
              badge(`${items.length} files`)
            ),
            h('ul', { style: 'display:flex; flex-direction:column; gap:0.6rem;' },
              items.map(item => h('li', {
                style: 'padding:0.5rem 0; border-top:1px solid var(--line);'
              },
                h('div', { class: 'row sb' },
                  fileLink(item.file),
                  badge(`Depth ${item.distance}`)
                ),
                h('div', { class: 'path-breadcrumb' },
                  'Impact path: ',
                  item.path.map((p, i) => [
                    i > 0 ? ' → ' : '',
                    h('span', { style: p === target ? 'color:var(--accent); font-weight:600;' : '' }, baseName(p))
                  ])
                )
              ))
            )
          )
        ) : h('div', { class: 'panel', style: 'text-align:center; padding:2rem 1rem;' },
          h('p', { class: 'mute' }, 'No other analyzed file imports this module. Blast radius is isolated to this file.')
        )
      );
    } catch (err) {
      put(resultContainer, h('div', { class: 'alert-banner err' }, err.message));
    }
  };

  const selectorPanel = h('div', { class: 'panel' },
    h('div', { class: 'panel-header' },
      h('div', {},
        h('h2', { class: 'panel-title' }, 'Reverse Impact Analysis &amp; Blast Radius'),
        h('p', { class: 'panel-subtitle' }, 'Cycle-safe BFS reverse dependency tree: estimate downstream components affected by a change.')
      )
    ),
    h('div', { class: 'row', style: 'margin-top:0.75rem;' },
      h('select', {
        id: 'impact-select',
        style: 'min-width:320px; max-width:100%;',
        onchange: e => {
          S.impactTarget = e.target.value;
          executeImpact();
        }
      },
        h('option', { value: '' }, 'Select a file to inspect downstream blast radius…'),
        sortedFiles.map(f => h('option', {
          value: f.path,
          selected: S.impactTarget === f.path
        }, `${f.path} (${f.fan_in} direct dependents)`))
      ),
      h('button', { class: 'primary', onclick: executeImpact }, 'Analyze Blast Radius')
    ),
    resultContainer
  );

  add(m, selectorPanel);
  if (S.impactTarget) executeImpact();
}

// -----------------------------------------
// View: Issues & Cycles
// -----------------------------------------
function renderIssues(m) {
  const sn = S.snap;
  const unres = sn.unresolved || [];
  const localUnres = unres.filter(u => !u.reason.startsWith('external'));
  const externalUnres = unres.filter(u => u.reason.startsWith('external'));

  const container = h('div', { class: 'stack' });

  // 1. Circular Dependencies (Tarjan SCC)
  const cycPanel = h('div', { class: 'panel' },
    h('div', { class: 'panel-header' },
      h('div', {},
        h('h3', { class: 'panel-title' }, 'Circular Dependencies (Tarjan SCC)'),
        h('p', { class: 'panel-subtitle' }, 'Mutual or indirect cyclic imports that risk runtime import deadlocks.')
      ),
      badge(`${sn.cycles.length} group${sn.cycles.length===1?'':'s'}`, sn.cycles.length ? 'bad' : 'ok')
    ),
    sn.cycles.length ? h('ul', { style: 'display:flex; flex-direction:column; gap:0.85rem;' },
      sn.cycles.map((cyc, idx) => h('li', {
        class: 'panel',
        style: 'background:var(--surface-subtle); border-color:color-mix(in oklab, var(--bad) 30%, transparent);'
      },
        h('div', { class: 'row sb', style: 'margin-bottom:0.5rem;' },
          h('b', { style: 'color:var(--bad);' }, `Cycle Loop #${idx + 1}`),
          badge(`${cyc.members.length} files in cycle`, 'bad')
        ),
        h('div', { class: 'path-breadcrumb', style: 'background:var(--surface);' },
          cyc.example.map((p, i) => [
            i > 0 ? ' 🔁 ' : '',
            h('button', { class: 'file-link', onclick: () => inspectFile(p) }, baseName(p))
          ])
        )
      ))
    ) : h('p', { class: 'mute', style: 'font-size:0.88rem;' }, 'No circular dependency cycles detected in this repository.')
  );

  // 2. Unresolved Local Imports
  const localPanel = h('div', { class: 'panel' },
    h('div', { class: 'panel-header' },
      h('div', {},
        h('h3', { class: 'panel-title' }, 'Unresolved Local Imports'),
        h('p', { class: 'panel-subtitle' }, 'Relative or in-project imports that failed to match an existing file.')
      ),
      badge(`${localUnres.length} items`, localUnres.length ? 'warn' : 'ok')
    ),
    localUnres.length ? h('ul', { style: 'display:flex; flex-direction:column; gap:0.4rem;' },
      localUnres.slice(0, 100).map(u => h('li', {
        style: 'padding:0.45rem 0; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; gap:0.5rem;'
      },
        h('div', {},
          fileLink(u.file),
          h('span', { class: 'mute mono', style: 'margin-left:0.5rem;' }, `L${u.line} → "${u.spec}"`)
        ),
        badge(u.reason, 'warn')
      ))
    ) : h('p', { class: 'mute', style: 'font-size:0.88rem;' }, 'All relative and workspace imports resolved cleanly.')
  );

  // 3. External Dependencies
  const extPanel = h('div', { class: 'panel' },
    h('div', { class: 'panel-header' },
      h('div', {},
        h('h3', { class: 'panel-title' }, 'External Dependencies &amp; Third-Party Modules'),
        h('p', { class: 'panel-subtitle' }, 'Imports referencing external libraries or package aliases.')
      ),
      badge(`${externalUnres.length} references`)
    ),
    externalUnres.length ? h('ul', { style: 'display:flex; flex-direction:column; gap:0.4rem;' },
      externalUnres.slice(0, 100).map(u => h('li', {
        style: 'padding:0.45rem 0; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; gap:0.5rem;'
      },
        h('div', {},
          fileLink(u.file),
          h('span', { class: 'mute mono', style: 'margin-left:0.5rem;' }, `L${u.line} → "${u.spec}"`)
        ),
        badge('external')
      ))
    ) : h('p', { class: 'mute', style: 'font-size:0.88rem;' }, 'None detected.')
  );

  // 4. Parse Errors & Skipped
  const parsePanel = h('div', { class: 'panel' },
    h('div', { class: 'panel-header' },
      h('div', {},
        h('h3', { class: 'panel-title' }, 'Parse &amp; Syntax Errors'),
        h('p', { class: 'panel-subtitle' }, 'Files that could not be parsed by Python AST or the TypeScript compiler.')
      ),
      badge(`${sn.parse_errors.length} errors`, sn.parse_errors.length ? 'bad' : 'ok')
    ),
    sn.parse_errors.length ? h('ul', { style: 'display:flex; flex-direction:column; gap:0.4rem;' },
      sn.parse_errors.map(e => h('li', {
        style: 'padding:0.45rem 0; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; gap:0.5rem;'
      },
        fileLink(e.file),
        h('span', { class: 'mono', style: 'color:var(--bad); font-size:0.82rem;' }, e.error)
      ))
    ) : h('p', { class: 'mute', style: 'font-size:0.88rem;' }, 'Zero syntax or AST parse errors encountered.')
  );

  // 5. Ignored & Excluded Counts
  const sc = sn.ignored_counts || {};
  const ignoredPanel = h('div', { class: 'panel' },
    h('h3', { class: 'panel-title', style: 'font-size:0.95rem; margin-bottom:0.5rem;' }, '📁 Scanner Exclusion Statistics'),
    h('p', { class: 'mute', style: 'font-size:0.85rem;' },
      `Cleanly omitted during crawl: ${sc.unsupported || 0} non-code files, ${sc.gitignored || 0} .gitignored entries, and ${sc.excluded_dirs || 0} excluded directories (node_modules, .git, venvs, dist).`
    )
  );

  add(container, cycPanel, localPanel, extPanel, parsePanel, ignoredPanel);
  add(m, container);
}

// -----------------------------------------
// File & Symbol Drawer (Side Inspector)
// -----------------------------------------
async function inspectFile(filePath) {
  S.sel = filePath;
  const drawer = $('#drawer');
  drawer.hidden = false;
  const f = byPath(filePath);
  if (!f) return;

  const srcBox = h('div', { id: 'src-box' });
  const unresolvedHere = (S.snap.unresolved || []).filter(u => u.file === filePath);

  const symItem = d => h('li', {
    style: 'padding:0.35rem 0; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;'
  },
    h('button', {
      class: 'file-link',
      onclick: () => loadSourceExcerpt(filePath, d.line, srcBox)
    }, (d.parent ? d.parent + '.' : '') + d.name),
    h('div', { class: 'row', style: 'gap:0.35rem;' },
      badge(d.kind),
      h('span', { class: 'mute mono', style: 'font-size:0.75rem;' }, `L${d.line}`)
    )
  );

  put(drawer,
    h('div', { class: 'row sb' },
      h('h3', { class: 'mono', style: 'font-size:0.95rem; overflow-wrap:anywhere; font-weight:700;' }, baseName(filePath)),
      h('button', {
        class: 'subtle sm',
        'aria-label': 'Close inspector',
        onclick: () => {
          S.sel = null;
          drawer.hidden = true;
          if (S.view === 'graph') window.__paintGraph?.();
        }
      }, '✕')
    ),
    h('div', { class: 'mute mono', style: 'font-size:0.78rem; overflow-wrap:anywhere;' }, filePath),
    h('div', { class: 'row', style: 'margin:0.25rem 0;' },
      langDot(f.lang),
      h('span', { style: 'font-weight:500;' }, f.lang),
      badge(`${f.loc} lines`),
      f.entry ? badge(`Entry: ${f.entry.confidence}`, f.entry.confidence) : null
    ),
    f.entry ? h('p', { class: 'mute', style: 'font-size:0.8rem; background:var(--surface-subtle); padding:0.4rem; border-radius:var(--r-sm);' }, f.entry.basis.replaceAll('`', '')) : null,
    f.error ? h('div', { class: 'alert-banner err', style: 'padding:0.5rem;' }, f.error) : null,
    
    // Quick Actions
    h('div', { class: 'row', style: 'margin:0.5rem 0;' },
      h('button', {
        class: 'primary sm',
        onclick: () => {
          S.impactTarget = filePath;
          switchView('impact');
        }
      }, 'Analyze Impact (BFS)'),
      h('button', {
        class: 'sm',
        onclick: () => loadSourceExcerpt(filePath, 1, srcBox)
      }, 'View Source')
    ),

    // Dependencies & Dependents
    h('div', { class: 'stack', style: 'gap:0.75rem;' },
      renderDepList('Imports (Dependencies)', f.depends_on),
      renderDepList('Imported By (Dependents)', f.dependents),
      f.defs.length ? h('div', {},
        h('h4', { style: 'font-size:0.82rem; text-transform:uppercase; color:var(--ink-muted); margin-bottom:0.35rem;' }, `Symbols (${f.defs.length})`),
        h('ul', { style: 'max-height:180px; overflow-y:auto;' }, f.defs.slice(0, 100).map(symItem))
      ) : null,
      f.exports?.length ? h('div', {},
        h('h4', { style: 'font-size:0.82rem; text-transform:uppercase; color:var(--ink-muted); margin-bottom:0.35rem;' }, 'Exports'),
        h('div', { class: 'row', style: 'gap:0.35rem;' }, f.exports.map(exp => badge(exp.name)))
      ) : null,
      unresolvedHere.length ? h('div', {},
        h('h4', { style: 'font-size:0.82rem; text-transform:uppercase; color:var(--warn); margin-bottom:0.35rem;' }, 'Unresolved Imports'),
        h('ul', {}, unresolvedHere.map(u => h('li', {
          style: 'padding:0.3rem 0; border-top:1px solid var(--line); display:flex; justify-content:space-between;'
        },
          h('span', { class: 'mono', style: 'font-size:0.8rem;' }, u.spec),
          badge(u.reason, u.reason.startsWith('external') ? '' : 'warn')
        )))
      ) : null,
      srcBox
    )
  );

  if (S.view === 'graph') window.__paintGraph?.();
}

function renderDepList(title, list) {
  return h('div', {},
    h('h4', { style: 'font-size:0.82rem; text-transform:uppercase; color:var(--ink-muted); margin-bottom:0.35rem;' },
      `${title} (${list.length})`
    ),
    list.length ? h('ul', { style: 'max-height:140px; overflow-y:auto;' },
      list.map(p => h('li', { style: 'padding:0.25rem 0; border-top:1px solid var(--line);' }, fileLink(p)))
    ) : h('p', { class: 'mute', style: 'font-size:0.82rem;' }, 'None')
  );
}

async function loadSourceExcerpt(filePath, targetLine, targetContainer) {
  try {
    targetContainer.innerHTML = '<span class="spinner"></span> Loading source excerpt…';
    const data = await api(`/api/source?path=${encodeURIComponent(filePath)}&line=${targetLine}`);
    
    put(targetContainer,
      h('div', { class: 'row sb', style: 'margin-top:0.75rem;' },
        h('h4', { style: 'font-size:0.82rem; font-weight:600;' }, `${baseName(data.file)}:${data.line}`),
        badge(`${data.lines.length} lines shown`)
      ),
      h('pre', { class: 'src-view' },
        data.lines.map((lineText, idx) => {
          const currentLineNo = data.start + idx;
          const isTarget = currentLineNo === data.line;
          return h('span', { class: `line-wrap ${isTarget ? 'hl' : ''}` },
            h('span', { class: 'line-num' }, currentLineNo),
            h('span', { class: 'line-text' }, lineText)
          );
        })
      )
    );
  } catch (err) {
    put(targetContainer, h('div', { class: 'alert-banner err', style: 'margin-top:0.5rem;' }, err.message));
  }
}

// -----------------------------------------
// Command Palette (Ctrl+K / ⌘K)
// -----------------------------------------
const palModal = $('#cmd-pal');
const palInput = $('#pal-input');
const palResults = $('#pal-results');
let palData = [], palActive = 0, palDebounce;

function openCommandPalette() {
  if (!S.snap) return;
  palModal.showModal();
  palInput.value = '';
  palResults.replaceChildren();
  palInput.focus();
}

$('#kbtn').addEventListener('click', openCommandPalette);
window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    palModal.open ? palModal.close() : openCommandPalette();
  }
});
palModal.addEventListener('click', e => {
  if (e.target === palModal) palModal.close();
});

function drawPalResults() {
  palResults.replaceChildren(...palData.map((item, idx) =>
    h('li', { role: 'option' },
      h('button', {
        type: 'button',
        'aria-selected': idx === palActive ? 'true' : 'false',
        onclick: () => selectPalItem(item)
      },
        h('span', { style: 'font-weight:500;' }, item.name),
        h('div', { class: 'row', style: 'gap:0.4rem;' },
          item.type !== 'file' ? h('span', { class: 'mute mono', style: 'font-size:0.78rem;' }, `${baseName(item.file)}:${item.line}`) : null,
          badge(item.type, item.type === 'file' ? 'accent' : '')
        )
      )
    )
  ));
  if (!palData.length && palInput.value.trim()) {
    palResults.append(h('li', { class: 'mute', style: 'padding:1rem;' }, 'No matching files or symbols found.'));
  }
}

function selectPalItem(item) {
  palModal.close();
  if (S.view !== 'files' && S.view !== 'graph') switchView('files');
  inspectFile(item.file).then(() => {
    if (item.type !== 'file') {
      const srcBox = $('#src-box');
      if (srcBox) loadSourceExcerpt(item.file, item.line, srcBox);
    }
  });
}

palInput.addEventListener('input', () => {
  clearTimeout(palDebounce);
  palDebounce = setTimeout(async () => {
    const q = palInput.value.trim();
    if (!q) { palData = []; drawPalResults(); return; }
    try {
      const res = await api(`/api/search?q=${encodeURIComponent(q)}`);
      palData = res.results || [];
    } catch {
      palData = [];
    }
    palActive = 0;
    drawPalResults();
  }, 120);
});

palInput.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    palActive = (palActive + (e.key === 'ArrowDown' ? 1 : -1) + palData.length) % Math.max(palData.length, 1);
    drawPalResults();
  } else if (e.key === 'Enter' && palData[palActive]) {
    e.preventDefault();
    selectPalItem(palData[palActive]);
  }
});

// Initialization
renderNav();
render();
</script>
