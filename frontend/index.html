<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>RepoLens: codebase architecture explorer</title>
<style>
@layer reset, tokens, base, layout, components, motion;
@layer reset { *,*::before,*::after{box-sizing:border-box} body,h1,h2,h3,p,ul{margin:0} ul{padding:0;list-style:none} button,input,select{font:inherit;color:inherit} }
@layer tokens {

    --line:light-dark(#e4e1d9,#2b2e35); --accent:light-dark(#3b3fd8,#8f93ff); --accent-ink:light-dark(#fff,#0f1020);
    --warn:light-dark(#b4501a,#f0a36b); --bad:light-dark(#c2264b,#ff7b9c); --ok:light-dark(#1e7a52,#6fd1a0);
    --py:light-dark(#2a6fb0,#6fb1ee); --js:light-dark(#b58a00,#e8c24a); --ts:light-dark(#7a3fc2,#b88af0);
    --r:12px; --shadow:0 1px 2px color-mix(in oklab,var(--ink) 8%,transparent),0 8px 24px -12px color-mix(in oklab,var(--ink) 18%,transparent);
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace; --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
}
@layer base {
  body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);min-height:100dvh;display:grid;grid-template-rows:auto 1fr}

  .mono{font-family:var(--mono);font-size:.86em} .mute{color:var(--mute)} h2{font-size:1.15rem;letter-spacing:-.01em} h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-bottom:.5rem}
  .sr{position:absolute;left:-9999px}
}
@layer layout {
  header{display:flex;flex-wrap:wrap;gap:.75rem 1rem;align-items:center;padding:.75rem 1.25rem;border-bottom:1px solid var(--line);background:color-mix(in oklab,var(--surface) 88%,transparent);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
  .brand{font-weight:700;letter-spacing:-.02em;display:flex;gap:.5rem;align-items:center} .brand i{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 200deg,var(--accent),var(--py),var(--accent));display:block}
  .repo{flex:1 1 320px;display:flex;gap:.5rem;min-width:0} .repo input{flex:1;min-width:0}
  nav{display:flex;gap:.25rem;flex-wrap:wrap;width:100%} 
  .shell{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem;padding:1rem 1.25rem;container-type:inline-size;align-items:start}
  .shell:has(aside:not([hidden])){grid-template-columns:minmax(0,1fr) minmax(280px,380px)}
  @container (max-width:760px){ .shell:has(aside:not([hidden])){grid-template-columns:minmax(0,1fr)} }
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.75rem}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
}
@layer components {
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem;box-shadow:var(--shadow)}
  .stack{display:grid;gap:1rem}
  input,select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.5rem .7rem;min-height:38px}
  button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:.45rem .8rem;min-height:38px;transition:background .15s,transform .1s}
  button:hover{background:color-mix(in oklab,var(--accent) 8%,var(--surface))} button:active{transform:scale(.97)}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600} button:disabled,a.btn[aria-disabled=true]{opacity:.5;pointer-events:none}

  .link{background:none;border:0;padding:0;min-height:0;color:var(--accent);text-align:left;font-family:var(--mono);font-size:.86em;overflow-wrap:anywhere} .link:hover{background:none;text-decoration:underline}

  table{width:100%;border-collapse:collapse;font-size:.9rem} th,td{text-align:left;padding:.45rem .5rem;border-top:1px solid var(--line)} th{font-size:.75rem;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;cursor:pointer;border-top:0;position:sticky;top:0;background:var(--surface)} td.n{text-align:right;font-variant-numeric:tabular-nums}

  .edge{stroke:color-mix(in oklab,var(--mute) 45%,transparent);stroke-width:1;fill:none} .edge.hot{stroke:var(--accent);stroke-width:1.8} .edge.cyc{stroke:var(--bad)} .edge.dim{opacity:.12}
  .node{cursor:pointer} .node circle{stroke:var(--surface);stroke-width:1.5} .node:focus-visible{outline:none} .node:focus-visible circle{stroke:var(--accent);stroke-width:3} .node.sel circle{stroke:var(--ink);stroke-width:2.5} .node.dim{opacity:.18} .node text{font-size:10px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;pointer-events:none}
  .legend{position:absolute;left:.75rem;bottom:.75rem;font-size:.75rem;color:var(--mute);background:color-mix(in oklab,var(--surface) 90%,transparent);padding:.3rem .6rem;border-radius:8px;border:1px solid var(--line)}
  pre.src{margin:.5rem 0 0;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:.5rem;overflow:auto;font:12px/1.5 var(--mono);max-height:240px} pre.src .hl{background:color-mix(in oklab,var(--accent) 18%,transparent);display:block}
  .path{font-family:var(--mono);font-size:.8rem;color:var(--mute);overflow-wrap:anywhere} .path b{color:var(--ink);font-weight:500}
  .empty{text-align:center;padding:3rem 1rem;max-width:560px;margin:2rem auto} .err{color:var(--bad);font-size:.9rem} .note{font-size:.85rem;color:var(--mute);border-left:3px solid var(--warn);padding-left:.7rem}
  dialog{border:1px solid var(--line);border-radius:14px;padding:0;width:min(620px,92vw);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px #0007;margin-top:12vh} dialog::backdrop{background:#0006;backdrop-filter:blur(3px)}
  dialog input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:1rem;font-size:1.05rem;min-height:56px} dialog input:focus-visible{outline:0} dialog ul{max-height:50dvh;overflow:auto} dialog li button{width:100%;border:0;border-radius:0;display:flex;gap:.6rem;justify-content:space-between;text-align:left;background:none} dialog li button[aria-selected=true]{background:color-mix(in oklab,var(--accent) 12%,transparent)}
  kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:5px;padding:0 .35rem;background:var(--bg)}
  .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:sp .7s linear infinite} @keyframes sp{to{transform:rotate(1turn)}}
}
@layer motion { ::view-transition-old(root),::view-transition-new(root){animation-duration:.18s} @media (prefers-reduced-motion:reduce){*,::view-transition-group(*){animation:none!important;transition:none!important}} }
</style>
</head>
<body>
<header>
  <div class="brand"><i aria-hidden="true"></i>RepoLens</div>
  <form class="repo" id="form"><label class="sr" for="path">Repository path</label>
    <input id="path" class="mono" placeholder="/absolute/path/to/repository" autocomplete="off" spellcheck="false" required>
    <button class="primary" id="go" type="submit">Analyze</button></form>
  <div class="row"><span id="status" class="mute" role="status" aria-live="polite"></span>
    <button id="kbtn" type="button" title="Search files and symbols">Search <kbd>Ctrl K</kbd></button>
    <a class="btn" id="report" href="/api/report" download="repolens-report.md" aria-disabled="true">Report</a></div>
  <nav id="nav" aria-label="Views"></nav>
</header>
<div class="shell"><main id="main" tabindex="-1"></main><aside id="detail" class="panel" hidden aria-label="Details"></aside></div>
<dialog id="pal" aria-label="Search"><input id="q" placeholder="Search files and symbols…" autocomplete="off" role="combobox" aria-controls="res" aria-expanded="true"><ul id="res" role="listbox"></ul></dialog>
